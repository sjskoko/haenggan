name: Android preview
on:
  push:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: haenggan-android-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: mobile/android/app/build/reports/tests/testDebugUnitTest

      - name: Publish fresh-install preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-preview >/dev/null 2>&1; then exit 0; fi
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk haenggan-0.2.0-preview-fresh-install.apk
          sha256sum haenggan-0.2.0-preview-fresh-install.apk > SHA256SUMS.txt
          gh release create v0.2.0-preview haenggan-0.2.0-preview-fresh-install.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "행간 0.2.0-preview · 새 설치 검토용" --notes-file docs/RELEASE-0.2.0.md
